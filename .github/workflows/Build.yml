name: build

# Builds both modules in the same pinned VitaSDK Docker image that `make` uses
# locally (see VITASDK_IMAGE in the Makefile), so CI and local builds match.
# Nothing here signs or publishes a release: the artifacts are for testing, with
# SHA-256 sums next to them so a downloaded file can be checked.

on:
  push:
    branches: [main, master, Dev_lifecycle]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host tests: the staging path, settings load/save, the formatter and the
  # translation table, run with AddressSanitizer + UBSan. No VitaSDK needed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make test
      - name: Fast copy, ARM code under qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf qemu-user
          make -C tests arm

  # Static analysis of the sources (warnings, performance, portability).
  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cppcheck
      - name: cppcheck
        run: make cppcheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build (pinned VitaSDK image)
        run: make build

      - name: Check both modules exist and are not empty
        run: |
          for f in build/vitamemio_kernel.skprx build/vitamemio.suprx build/vitamemio_tester.vpk; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: SHA-256 sums
        run: |
          cd build
          sha256sum vitamemio_kernel.skprx vitamemio.suprx vitamemio_tester.vpk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: vita-memio-${{ github.sha }}
          path: |
            build/vitamemio_kernel.skprx
            build/vitamemio.suprx
            build/vitamemio_tester.vpk
            build/SHA256SUMS
            include/OFL-Terminus.txt
          if-no-files-found: error

  # A pushed tag v* publishes a GitHub release with the built files, once the
  # tests, cppcheck and the build have passed. Its text is
  # .github/release-notes/<tag>.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cppcheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vita-memio-${{ github.sha }}
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          test -f "$notes" || { echo "missing $notes"; exit 1; }
          gh release create "$TAG" --title "vita-memio ${TAG#v}" --notes-file "$notes" \
            dist/build/vitamemio_kernel.skprx dist/build/vitamemio.suprx \
            dist/build/vitamemio_tester.vpk dist/build/SHA256SUMS
