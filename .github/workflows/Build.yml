name: build

# Builds both modules in the same pinned VitaSDK Docker image that `make` uses
# locally (see VITASDK_IMAGE in the Makefile), so CI and local builds match.
# Nothing here signs or publishes a release: the artifacts are for testing, with
# SHA-256 sums next to them so a downloaded file can be checked.

on:
  push:
    branches: [main, master, Dev_lifecycle]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build (pinned VitaSDK image)
        run: make build

      - name: Check both modules exist and are not empty
        run: |
          for f in build/storageturbo_kernel.skprx build/storageturbo.suprx; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: SHA-256 sums
        run: |
          cd build
          sha256sum storageturbo_kernel.skprx storageturbo.suprx | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: turbo-storage-${{ github.sha }}
          path: |
            build/storageturbo_kernel.skprx
            build/storageturbo.suprx
            build/SHA256SUMS
          if-no-files-found: error

  # Same build with the diagnostics build option on, so a change that breaks
  # `-DTS_DEV_ALLOW_RISKY=1` is caught too. Not uploaded.
  build-dev-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build with TS_DEV_ALLOW_RISKY
        run: make build BUILD=build-dev CMAKE_ARGS="-DTS_DEV_ALLOW_RISKY=ON"