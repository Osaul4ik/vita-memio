name: build

# Builds both modules in the same pinned VitaSDK Docker image that `make` uses
# locally (see VITASDK_IMAGE in the Makefile), so CI and local builds match.
# Nothing here signs or publishes a release: the artifacts are for testing, with
# SHA-256 sums next to them so a downloaded file can be checked.

on:
  push:
    branches: [main, master, Dev_lifecycle]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Host tests: the staging path, settings load/save, the formatter and the
  # translation table, run with AddressSanitizer + UBSan. No VitaSDK needed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: make test
      - name: Fast copy, ARM code under qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-arm-linux-gnueabihf qemu-user
          make -C tests arm

  # Static analysis of the sources (warnings, performance, portability).
  cppcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install cppcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cppcheck
      - name: cppcheck
        run: make cppcheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build (pinned VitaSDK image)
        run: make build

      - name: Check both modules exist and are not empty
        run: |
          for f in build/vitamemio_kernel.skprx build/vitamemio.suprx build/vitamemio_tester.vpk; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      - name: SHA-256 sums
        run: |
          cd build
          sha256sum vitamemio_kernel.skprx vitamemio.suprx vitamemio_tester.vpk | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: vita-memio-${{ github.sha }}
          path: |
            build/vitamemio_kernel.skprx
            build/vitamemio.suprx
            build/vitamemio_tester.vpk
            build/SHA256SUMS
            include/OFL-Terminus.txt
          if-no-files-found: error
